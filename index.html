<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mi dinero — Finanzas Personales</title>
  <meta name="description" content="Organizador profesional de finanzas personales, gastos hormiga, ganancia diaria, proyectos y pagos fijos 100% offline." />
  <meta name="theme-color" content="#F2F2F7" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="appleStatusBar" />
  <meta name="apple-mobile-web-app-title" content="Mi dinero" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    /* ==========================================================================
       1. TOKENS DE DISEÑO EN 3 NIVELES (PRIMITIVOS -> SEMÁNTICOS -> COMPONENTE)
       ========================================================================== */
    :root {
      /* Nivel 1: Primitivos */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --radius-full: 9999px;

      --apple-blue: #007AFF;
      --apple-green: #34C759;
      --apple-red: #FF3B30;
      --apple-orange: #FF9500;
      --apple-teal: #30B0C7;
      --apple-pink: #FF2D55;

      /* Nivel 2: Semánticos (Modo Claro Apple System Grouped) */
      --bg-canvas: #F2F2F7;
      --bg-surface: #FFFFFF;
      --bg-surface-elevated: #FFFFFF;
      --bg-fill-secondary: rgba(120, 120, 128, 0.12);
      --bg-fill-tertiary: rgba(120, 120, 128, 0.08);
      --separator: rgba(60, 60, 67, 0.12);

      --text-primary: #000000;
      --text-secondary: rgba(60, 60, 67, 0.68);
      --text-tertiary: #8E8E93;

      --accent: #007AFF;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --accent-contrast: #FFFFFF;
      --positive: #28A745;
      --positive-soft: rgba(52, 199, 89, 0.14);
      --warning: #D97706;
      --warning-soft: rgba(255, 149, 0, 0.15);
      --danger: #E02424;
      --danger-soft: rgba(255, 59, 48, 0.13);

      /* Nivel 3: Liquid Glass & Componentes */
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-card-bg: rgba(255, 255, 255, 0.84);
      --glass-border: rgba(255, 255, 255, 0.78);
      --glass-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.92), inset 0 -0.5px 0 0 rgba(0, 0, 0, 0.06);
      --glass-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(28px) saturate(210%);

      --card-radius: var(--radius-lg);
      --card-padding: var(--space-4);
      --card-inner-radius: calc(var(--card-radius) - var(--card-padding));
      --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
    }

    .dark {
      --bg-canvas: #000000;
      --bg-surface: #1C1C1E;
      --bg-surface-elevated: #2C2C2E;
      --bg-fill-secondary: rgba(120, 120, 128, 0.24);
      --bg-fill-tertiary: rgba(120, 120, 128, 0.16);
      --separator: rgba(84, 84, 88, 0.38);

      --text-primary: #FFFFFF;
      --text-secondary: rgba(235, 235, 245, 0.68);
      --text-tertiary: #8E8E93;

      --positive: #30D158;
      --positive-soft: rgba(48, 209, 88, 0.18);
      --warning: #FF9F0A;
      --warning-soft: rgba(255, 159, 10, 0.18);
      --danger: #FF453A;
      --danger-soft: rgba(255, 69, 58, 0.18);

      --glass-bg: rgba(28, 28, 30, 0.72);
      --glass-card-bg: rgba(28, 28, 30, 0.82);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.18), inset 0 -0.5px 0 0 rgba(0, 0, 0, 0.45);
      --glass-shadow: 0 12px 34px -10px rgba(0, 0, 0, 0.55);
    }

    /* Intensidades de Apple Liquid Glass */
    [data-glass="subtle"] {
      --glass-bg: rgba(255, 255, 255, 0.86);
      --glass-card-bg: rgba(255, 255, 255, 0.94);
      --glass-blur: blur(14px) saturate(160%);
    }
    .dark[data-glass="subtle"] {
      --glass-bg: rgba(28, 28, 30, 0.88);
      --glass-card-bg: rgba(28, 28, 30, 0.94);
    }
    [data-glass="intense"] {
      --glass-bg: rgba(255, 255, 255, 0.56);
      --glass-card-bg: rgba(255, 255, 255, 0.68);
      --glass-blur: blur(40px) saturate(250%);
      --glass-specular: inset 0 1.5px 0 0 rgba(255, 255, 255, 0.98), inset 0 -1px 0 0 rgba(255, 255, 255, 0.35);
    }
    .dark[data-glass="intense"] {
      --glass-bg: rgba(28, 28, 30, 0.56);
      --glass-card-bg: rgba(28, 28, 30, 0.66);
      --glass-specular: inset 0 1.5px 0 0 rgba(255, 255, 255, 0.28), inset 0 -1px 0 0 rgba(255, 255, 255, 0.08);
    }

    /* ==========================================================================
       2. RESET Y BASE TÁCTIL
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
      overflow-x: hidden;
      min-height: 100dvh;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
      border: none;
      background: none;
      padding: 0;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .tap-spring {
      transition: transform 0.16s var(--ease-spring), opacity 0.16s ease, background-color 0.16s ease;
    }
    .tap-spring:active {
      transform: scale(0.97);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       3. CAPA AMBIENTAL ÓPTICA (NO INTERCEPTA TOQUES)
       ========================================================================== */
    .ambient-orb-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .ambient-orb-1 {
      position: absolute;
      top: -90px;
      right: -70px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.11;
      filter: blur(65px);
    }
    .ambient-orb-2 {
      position: absolute;
      bottom: 80px;
      left: -80px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: #34C759;
      opacity: 0.08;
      filter: blur(70px);
    }

    /* ==========================================================================
       4. ENCABEZADO SUPERIOR LIQUID GLASS (STICKY Z-30 SIN COLISIONES)
       ========================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 0.5px solid var(--separator);
      box-shadow: var(--glass-specular);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .header-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .avatar-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-contrast);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      color: var(--text-primary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34C759;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.2);
    }
    .status-dot.offline {
      background: #FF9500;
      box-shadow: 0 0 0 3px rgba(255, 149, 0, 0.22);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-circle-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      border-radius: 50%;
      background: var(--bg-fill-secondary);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .primary-pill-btn {
      height: 40px;
      padding: 0 13px;
      border-radius: var(--radius-full);
      background: var(--accent);
      color: var(--accent-contrast);
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      box-shadow: 0 4px 14px -4px rgba(0, 122, 255, 0.45);
    }

    /* ==========================================================================
       5. CONTENEDOR PRINCIPAL (Z-10 DEBAJO DEL HEADER)
       ========================================================================== */
    .app-main {
      position: relative;
      z-index: 10;
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 16px calc(108px + env(safe-area-inset-bottom, 0px));
    }

    .greeting-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .large-title {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .subtitle-date {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .cut-pill {
      padding: 6px 11px;
      border-radius: var(--radius-full);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ==========================================================================
       6. TARJETAS SUPERFICIE Y LIQUID GLASS
       ========================================================================== */
    .surface-card {
      background: var(--bg-surface);
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      border: 0.5px solid var(--separator);
      margin-bottom: 14px;
    }

    .liquid-card {
      background: var(--glass-card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: var(--radius-xl);
      padding: 18px;
      border: 0.5px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
      margin-bottom: 14px;
    }

    .card-header-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-eyebrow {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .badge-pill {
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-positive {
      background: var(--positive-soft);
      color: var(--positive);
    }
    .badge-warning {
      background: var(--warning-soft);
      color: var(--warning);
    }
    .badge-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .badge-accent {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .hero-balance {
      font-size: clamp(32px, 8.5vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin: 4px 0 6px;
    }

    .hero-helper {
      margin: 0 0 14px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    /* 3 Mini-cajas concéntricas dentro del héroe */
    .hero-triple-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .mini-stat-box {
      background: var(--bg-fill-tertiary);
      border-radius: 14px;
      padding: 10px 9px;
      border: 0.5px solid var(--separator);
      min-width: 0;
    }

    .mini-stat-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-stat-val {
      font-size: clamp(12.5px, 3.6vw, 15px);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progreso lineal estilo Apple Salud */
    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--bg-fill-secondary);
      overflow: hidden;
      margin: 10px 0 8px;
    }

    .progress-fill {
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--positive);
      transition: width 0.35s var(--ease-spring), background-color 0.2s ease;
    }

    /* Secciones y encabezados */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 18px 0 10px;
    }

    .section-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .link-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 32px;
      padding: 0 4px;
    }

    /* Botones rápidos de 1 toque */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 16px;
    }

    .quick-chip-btn {
      background: var(--bg-surface);
      border: 0.5px solid var(--separator);
      border-radius: 16px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      min-height: 54px;
    }

    .quick-chip-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .squircle-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .quick-chip-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quick-chip-sub {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .quick-chip-amount {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Carrusel / Grid de cuentas estilo Apple Wallet */
    .accounts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .account-wallet-card {
      background: var(--bg-surface);
      border: 0.5px solid var(--separator);
      border-radius: 18px;
      padding: 13px;
      position: relative;
      overflow: hidden;
    }

    .account-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }

    .account-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .account-name {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-bal {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* Listas agrupadas Apple con separador alineado al texto */
    .grouped-list {
      background: var(--bg-surface);
      border-radius: var(--card-radius);
      border: 0.5px solid var(--separator);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      padding: 12px 14px;
      position: relative;
    }

    .list-row + .list-row::before {
      content: "";
      position: absolute;
      top: 0;
      left: 58px;
      right: 0;
      height: 0.5px;
      background: var(--separator);
    }

    .list-row-main {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .list-row-text {
      min-width: 0;
      flex: 1 1 auto;
    }

    .list-row-title {
      font-size: 14.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-row-meta {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .list-row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Círculo interactivo estilo Apple Recordatorios */
    .reminder-check-btn {
      width: 44px;
      height: 44px;
      margin: -8px 0 -8px -8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .reminder-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--text-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s var(--ease-spring);
    }

    .reminder-circle.checked {
      background: var(--positive);
      border-color: var(--positive);
      color: #FFFFFF;
    }

    /* ==========================================================================
       7. BARRA INFERIOR FLOTANTE LIQUID GLASS (Z-40)
       ========================================================================== */
    .bottom-dock-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      display: flex;
      justify-content: center;
    }

    .bottom-dock {
      pointer-events: auto;
      width: 100%;
      max-width: 540px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 0.5px solid var(--glass-border);
      box-shadow: var(--glass-specular), 0 12px 32px -8px rgba(0, 0, 0, 0.16);
      border-radius: var(--radius-xl);
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
    }

    .nav-tab-btn {
      min-height: 48px;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-tertiary);
      font-size: 10.5px;
      font-weight: 600;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    .nav-tab-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* ==========================================================================
       8. CONTROLES DE FORMULARIO, FILTROS Y BOTTOM SHEETS (Z-50)
       ========================================================================== */
    .filter-scroll {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      padding: 8px 13px;
      min-height: 36px;
      border-radius: var(--radius-full);
      background: var(--bg-surface);
      border: 0.5px solid var(--separator);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-pill.active {
      background: var(--accent);
      color: var(--accent-contrast);
      border-color: var(--accent);
    }

    .input-field {
      width: 100%;
      min-height: 44px;
      padding: 10px 13px;
      border-radius: 13px;
      border: 0.5px solid var(--separator);
      background: var(--bg-fill-tertiary);
      font-size: 15px;
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .segmented-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: var(--bg-fill-secondary);
      margin-bottom: 14px;
    }

    .seg-btn {
      min-height: 38px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.44);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      pointer-events: none;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-backdrop.open {
      display: flex;
      pointer-events: auto;
    }

    .bottom-sheet {
      width: 100%;
      max-width: 600px;
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--bg-surface);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 10px 18px calc(24px + env(safe-area-inset-bottom, 0px));
      border-top: 0.5px solid var(--glass-border);
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.18);
      animation: sheetSlideUp 0.26s var(--ease-spring);
    }

    @keyframes sheetSlideUp {
      from { transform: translateY(36px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-grabber {
      width: 36px;
      height: 5px;
      border-radius: 99px;
      background: var(--separator);
      margin: 0 auto 12px;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sheet-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .btn-block-primary {
      width: 100%;
      min-height: 48px;
      border-radius: 15px;
      background: var(--accent);
      color: var(--accent-contrast);
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-block-secondary {
      width: 100%;
      min-height: 44px;
      border-radius: 14px;
      background: var(--bg-fill-secondary);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Toast flotante con Deshacer (Z-60) */
    .toast-banner {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      z-index: 60;
      background: rgba(28, 28, 30, 0.94);
      color: #FFFFFF;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 10px 14px;
      border-radius: var(--radius-full);
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      max-width: calc(100vw - 28px);
    }

    .toast-banner.visible {
      display: flex;
      transform: translateX(-50%) translateY(0);
    }

    .toast-undo-btn {
      color: #4DA3FF;
      font-weight: 700;
      font-size: 13px;
      padding: 4px 8px;
      min-height: 32px;
    }

    /* Gráfica de barras 7 días */
    .bars-7d {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      align-items: end;
      height: 130px;
      padding-top: 16px;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: flex-end;
    }

    .bar-pair {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 92px;
      width: 100%;
      justify-content: center;
    }

    .bar-stick {
      width: 8px;
      border-radius: 5px;
      min-height: 4px;
      transition: height 0.3s var(--ease-spring);
    }

    .swatch-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .swatch-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2.5px solid transparent;
    }

    .swatch-btn.active {
      border-color: var(--text-primary);
      transform: scale(1.08);
    }

    .empty-guide-card {
      background: var(--bg-surface);
      border: 1px dashed var(--separator);
      border-radius: var(--card-radius);
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <!-- Capa óptica ambiental (no intercepta toques) -->
  <div class="ambient-orb-layer" aria-hidden="true">
    <div class="ambient-orb-1"></div>
    <div class="ambient-orb-2"></div>
  </div>

  <!-- Encabezado Liquid Glass Sticky (z-30) -->
  <header class="app-header">

            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>

        <button type="button" class="icon-circle-btn tap-spring" data-action="nav-tab" data-tab="settings" aria-label="Ir a Ajustes" title="Ajustes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
          </svg>
        </button>

        <button type="button" class="primary-pill-btn tap-spring" data-action="open-tx-modal" data-type="expense">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Registrar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido Principal (z-10) -->
  <main class="app-main">
    <div class="greeting-row">
      <div>
        <h1 class="large-title" id="greetingTitle">Hola, Jeffer</h1>
        <p class="subtitle-date tabular" id="todayDateLabel">Cargando fecha...</p>
      </div>
      <span class="cut-pill tabular" id="cycleBadge">Corte día 1</span>
    </div>

    <div id="viewContainer"></div>
  </main>

  <!-- Barra Flotante Inferior Liquid Glass (z-40) -->
  <nav class="bottom-dock-wrap" aria-label="Navegación principal">
    <div class="bottom-dock">
      <button type="button" class="nav-tab-btn active tap-spring" data-action="nav-tab" data-tab="overview">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="2"/>
          <rect x="14" y="3" width="7" height="7" rx="2"/>
          <rect x="14" y="14" width="7" height="7" rx="2"/>
          <rect x="3" y="14" width="7" height="7" rx="2"/>
        </svg>
        <span>Resumen</span>
      </button>

      <button type="button" class="nav-tab-btn tap-spring" data-action="nav-tab" data-tab="movements">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <circle cx="4" cy="6" r="1"/>
          <circle cx="4" cy="12" r="1"/>
          <circle cx="4" cy="18" r="1"/>
        </svg>
        <span>Movimientos</span>
      </button>

      <button type="button" class="nav-tab-btn tap-spring" data-action="nav-tab" data-tab="projects">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <span>Proyectos</span>
      </button>

      <button type="button" class="nav-tab-btn tap-spring" data-action="nav-tab" data-tab="analytics">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>Analítica</span>
      </button>

      <button type="button" class="nav-tab-btn tap-spring" data-action="nav-tab" data-tab="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
        <span>Ajustes</span>
      </button>
    </div>
  </nav>

  <!-- Toast Flotante con Deshacer (z-60) -->
  <div class="toast-banner" id="toastBanner" role="status" aria-live="polite">
    <span id="toastMessage">Listo</span>
    <button type="button" class="toast-undo-btn" id="toastUndoBtn" data-action="undo-last" style="display:none;">Deshacer</button>
  </div>

  <!-- ==========================================================================
       BOTTOM SHEETS (MODALES DESLIZABLES ESTILO APPLE HIG, Z-50)
       ========================================================================== -->

  <!-- 1. Modal Registrar / Editar Movimiento -->
  <div class="sheet-backdrop" id="txModalBackdrop" data-action="close-backdrop">
    <div class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="txModalTitle">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="txModalTitle">Nuevo movimiento</h2>
        <button type="button" class="icon-circle-btn" data-action="close-modals" aria-label="Cerrar">✕</button>
      </div>
      <form id="txForm">
        <input type="hidden" id="txIdInput" />
        <div class="segmented-row" role="group" aria-label="Tipo de movimiento">
          <button type="button" class="seg-btn active" data-action="set-tx-type" data-txtype="expense">Gasto</button>
          <button type="button" class="seg-btn" data-action="set-tx-type" data-txtype="income">Ingreso</button>
          <button type="button" class="seg-btn" data-action="set-tx-type" data-txtype="transfer">Transferir</button>
        </div>

        <div class="form-group">
          <label class="form-label" for="txAmountInput">Monto (COP)</label>
          <input type="number" inputmode="numeric" min="1" step="any" class="input-field tabular" id="txAmountInput" placeholder="Ej. 15000" required />
        </div>

        <div class="form-group" id="txCategoryGroup">
          <label class="form-label" for="txCategorySelect">Categoría</label>
          <select class="input-field" id="txCategorySelect"></select>
        </div>

        <div class="form-group" id="txNatureGroup">
          <label class="form-label" for="txNatureSelect">Clasificación del gasto</label>
          <select class="input-field" id="txNatureSelect">
            <option value="hormiga">Gasto Hormiga (pequeño / impulsivo)</option>
            <option value="necesario">Gasto Necesario (esencial)</option>
            <option value="ocio">Ocio / Gustos</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="txAccountSelect" id="txAccountLabel">Cuenta / Bolsillo</label>
          <select class="input-field" id="txAccountSelect"></select>
        </div>

        <div class="form-group" id="txToAccountGroup" style="display:none;">
          <label class="form-label" for="txToAccountSelect">Cuenta de destino</label>
          <select class="input-field" id="txToAccountSelect"></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="txNoteInput">Nota o detalle</label>
          <input type="text" maxlength="80" class="input-field" id="txNoteInput" placeholder="Ej. Empanada y café, Pasaje, Venta..." />
        </div>

        <div class="form-group">
          <label class="form-label" for="txDateInput">Fecha</label>
          <input type="date" class="input-field tabular" id="txDateInput" required />
        </div>

        <button type="submit" class="btn-block-primary tap-spring">Guardar movimiento</button>
      </form>
    </div>
  </div>

  <!-- 2. Modal Crear / Editar Proyecto y Apartar Dinero -->
  <div class="sheet-backdrop" id="projectModalBackdrop" data-action="close-backdrop">
    <div class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="projectModalTitle">Proyecto / Hucha</h2>
        <button type="button" class="icon-circle-btn" data-action="close-modals" aria-label="Cerrar">✕</button>
      </div>
      <form id="projectForm">
        <input type="hidden" id="projIdInput" />
        <div class="form-group">
          <label class="form-label" for="projNameInput">Nombre del proyecto o meta</label>
          <input type="text" maxlength="50" class="input-field" id="projNameInput" placeholder="Ej. Viaje a Lima, Fondo Emergencia" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="projTargetInput">Meta total (COP)</label>
          <input type="number" inputmode="numeric" min="1000" step="any" class="input-field tabular" id="projTargetInput" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="projSavedInput">Dinero apartado actualmente (COP)</label>
          <input type="number" inputmode="numeric" min="0" step="any" class="input-field tabular" id="projSavedInput" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="projColorInput">Color identificador</label>
          <input type="color" class="input-field" id="projColorInput" value="#007AFF" style="height:46px;padding:4px;" />
        </div>
        <button type="submit" class="btn-block-primary tap-spring">Guardar proyecto</button>
      </form>
    </div>
  </div>

  <!-- 3. Modal Pago Fijo (Recordatorio) -->
  <div class="sheet-backdrop" id="reminderModalBackdrop" data-action="close-backdrop">
    <div class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="reminderModalTitle">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="reminderModalTitle">Pago fijo mensual</h2>
        <button type="button" class="icon-circle-btn" data-action="close-modals" aria-label="Cerrar">✕</button>
      </div>
      <form id="reminderForm">
        <input type="hidden" id="remIdInput" />
        <div class="form-group">
          <label class="form-label" for="remTitleInput">Concepto del pago</label>
          <input type="text" maxlength="50" class="input-field" id="remTitleInput" placeholder="Ej. Plan móvil, Gimnasio, Internet" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="remAmountInput">Monto estimado (COP)</label>
          <input type="number" inputmode="numeric" min="100" step="any" class="input-field tabular" id="remAmountInput" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="remDueDayInput">Día de vencimiento del mes (1 - 31)</label>
          <input type="number" inputmode="numeric" min="1" max="31" class="input-field tabular" id="remDueDayInput" value="15" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="remAccountSelect">Cuenta sugerida de pago</label>
          <select class="input-field" id="remAccountSelect"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="remCategorySelect">Categoría</label>
          <select class="input-field" id="remCategorySelect"></select>
        </div>
        <button type="submit" class="btn-block-primary tap-spring">Guardar pago fijo</button>
      </form>
    </div>
  </div>

  <!-- 4. Modal Categoría Personalizada -->
  <div class="sheet-backdrop" id="categoryModalBackdrop" data-action="close-backdrop">
    <div class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="categoryModalTitle">Categoría</h2>
        <button type="button" class="icon-circle-btn" data-action="close-modals" aria-label="Cerrar">✕</button>
      </div>
      <form id="categoryForm">
        <input type="hidden" id="catIdInput" />
        <div class="form-group">
          <label class="form-label" for="catNameInput">Nombre de la categoría</label>
          <input type="text" maxlength="36" class="input-field" id="catNameInput" placeholder="Ej. Café y Mecato, Transporte" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="catTagInput">Sigla corta (2 letras)</label>
          <input type="text" maxlength="2" class="input-field" id="catTagInput" placeholder="Ej. CM" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="catNatureSelect">Naturaleza por defecto</label>
          <select class="input-field" id="catNatureSelect">
            <option value="hormiga">Gasto Hormiga</option>
            <option value="necesario">Gasto Necesario</option>
            <option value="ocio">Ocio / Gustos</option>
            <option value="ingreso">Ingreso / Ganancia</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="catBudgetInput">Presupuesto tope mensual (0 = sin tope)</label>
          <input type="number" inputmode="numeric" min="0" step="any" class="input-field tabular" id="catBudgetInput" value="0" />
        </div>
        <div class="form-group">
          <label class="form-label" for="catColorInput">Color</label>
          <input type="color" class="input-field" id="catColorInput" value="#007AFF" style="height:46px;padding:4px;" />
        </div>
        <button type="submit" class="btn-block-primary tap-spring">Guardar categoría</button>
      </form>
    </div>
  </div>

  <!-- 5. Modal Cuenta / Bolsillo -->
  <div class="sheet-backdrop" id="accountModalBackdrop" data-action="close-backdrop">
    <div class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="accountModalTitle">Cuenta / Bolsillo</h2>
        <button type="button" class="icon-circle-btn" data-action="close-modals" aria-label="Cerrar">✕</button>
      </div>
      <form id="accountForm">
        <input type="hidden" id="accIdInput" />
        <div class="form-group">
          <label class="form-label" for="accNameInput">Nombre de la cuenta</label>
          <input type="text" maxlength="32" class="input-field" id="accNameInput" placeholder="Ej. Nequi, Bancolombia, Efectivo" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="accBalanceInput">Saldo real actual (COP)</label>
          <input type="number" inputmode="numeric" step="any" class="input-field tabular" id="accBalanceInput" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="accColorInput">Color identificador</label>
          <input type="color" class="input-field" id="accColorInput" value="#007AFF" style="height:46px;padding:4px;" />
        </div>
        <button type="submit" class="btn-block-primary tap-spring">Guardar cuenta</button>
      </form>
    </div>
  </div>

  <!-- 6. Modal Botón Rápido 1-Toque -->
  <div class="sheet-backdrop" id="quickBtnModalBackdrop" data-action="close-backdrop">
    <div class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="quickBtnModalTitle">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="quickBtnModalTitle">Botón rápido 1 toque</h2>
        <button type="button" class="icon-circle-btn" data-action="close-modals" aria-label="Cerrar">✕</button>
      </div>
      <form id="quickBtnForm">
        <input type="hidden" id="qbIdInput" />
        <div class="form-group">
          <label class="form-label" for="qbLabelInput">Nombre del acceso rápido</label>
          <input type="text" maxlength="28" class="input-field" id="qbLabelInput" placeholder="Ej. Café / Mecato, Pasaje Bus" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="qbTypeSelect">Tipo</label>
          <select class="input-field" id="qbTypeSelect">
            <option value="expense">Gasto rápido</option>
            <option value="income">Ganancia rápida</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="qbAmountInput">Monto fijo (COP)</label>
          <input type="number" inputmode="numeric" min="100" step="any" class="input-field tabular" id="qbAmountInput" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="qbCategorySelect">Categoría</label>
          <select class="input-field" id="qbCategorySelect"></select>
        </div>
